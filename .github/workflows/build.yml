name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  # A broken installer script would otherwise only show up mid-release, so
  # compile it against a stub program whenever it changes.
  installer-check:
    name: Compile installer script
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          mkdir -p dist && echo stub > dist/RepoGrowth.exe
          # Git Bash would otherwise rewrite /DAppVersion=... into a file path.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$(bash .github/find-iscc.sh)" "/DAppVersion=0.0.0" installer/repo_growth.iss

  build:
    if: github.event_name == 'push'
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: RepoGrowth-windows.exe
          - os: macos-latest
            label: macos
            asset: RepoGrowth-macos.zip
          - os: ubuntu-22.04
            label: linux
            asset: RepoGrowth-linux

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The built app reports this as its version and compares it against the
      # latest release tag, so it has to be the tag we're building.
      - name: Stamp version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python - "$version" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("version.py")
          text = path.read_text(encoding="utf-8")
          new, n = re.subn(r'^__version__ = ".*"$',
                           f'__version__ = "{sys.argv[1]}"', text, flags=re.M)
          if n != 1:
              raise SystemExit(f"expected one __version__ line in version.py, found {n}")
          path.write_text(new, encoding="utf-8")
          print(new.strip().splitlines()[-1])
          PY

      - name: Build
        run: pyinstaller repo_growth.spec

      - name: Package (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: cp dist/RepoGrowth.exe "${{ matrix.asset }}"

      - name: Package (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: cp dist/RepoGrowth "${{ matrix.asset }}"

      - name: Package (macOS)
        if: matrix.label == 'macos'
        run: ditto -c -k --keepParent dist/RepoGrowth.app "${{ matrix.asset }}"

      - name: Build installer (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          # Git Bash would otherwise rewrite /DAppVersion=... into a file path.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$(bash .github/find-iscc.sh)" "/DAppVersion=$VERSION" installer/repo_growth.iss
          cp installer/Output/RepoGrowth-Setup.exe RepoGrowth-Setup.exe

      - name: Publish to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.label == 'windows' && 'RepoGrowth-Setup.exe' || '' }}
