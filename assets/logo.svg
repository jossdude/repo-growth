<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Repo Growth">
  <!-- Repo Growth mark: a lines-of-code curve rising off the axis. The axis is
       drawn in the border colour so it fades away at favicon sizes and the
       curve carries the mark on its own. -->
  <path d="M6 4.5 V26 H27.5"
        fill="none" stroke="#2a3242" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9.5 21.2 L14.8 16.2 L19.2 18.4 L25 9.2"
        fill="none" stroke="#00e5a0" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
